name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build without signing
        run: >-
          xcodebuild
          -project Converter.xcodeproj
          -scheme Converter
          -configuration Release
          -sdk macosx
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          build
          CODE_SIGNING_ALLOWED=NO
